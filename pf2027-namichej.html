<title>Namíchej si PF 2027</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito+Sans:wght@400;600;700&display=swap">
<style>
/* Layout: the stage (animals forming the letters) is the hero; the "mixing desk" of choices sits under it in four groups. The palette choice re-themes the whole page. */
:root {
  --bg1: #0f1d3a; --bg2: #1d3566;      /* set from the chosen palette */
  --fg: #eaf2ff; --accent: #9fd3ff;
  --muted: rgba(234, 242, 255, 0.68);
  --chip: rgba(234, 242, 255, 0.08);
  --line: rgba(234, 242, 255, 0.18);
  --f-head: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
  --f-body: "Nunito Sans", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg1); }
body {
  margin: 0; color: var(--fg); font-family: var(--f-body); font-size: 16px; line-height: 1.5;
  background: linear-gradient(170deg, var(--bg2), var(--bg1) 70%) fixed;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px 44px;
  transition: background 0.4s, color 0.4s;
}
.wrap { max-width: 1100px; margin: 0 auto; display: grid; gap: 18px; }
header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 8px 20px; }
.eyebrow { margin: 0; font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
h1 { margin: 0; font-family: var(--f-head); font-weight: 600; font-size: clamp(26px, 4vw, 40px); line-height: 1.1; text-wrap: balance; }
h1 span { color: var(--accent); }

.stage {
  position: relative; width: 100%; max-width: 100%; aspect-ratio: 16 / 9;
  border-radius: 14px; overflow: hidden; border: 1px solid var(--line);
  background: radial-gradient(110% 80% at 50% 35%, rgba(255,255,255,0.08), transparent 70%);
  touch-action: pan-y;
}
@media (max-width: 640px) { .stage { aspect-ratio: 4 / 5; } }
canvas { display: block; width: 100%; height: 100%; }

.desk { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 26px; }
@media (max-width: 760px) { .desk { grid-template-columns: minmax(0, 1fr); } }
fieldset { margin: 0; padding: 0; border: 0; min-width: 0; }
legend { padding: 0; margin-bottom: 8px; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  font: inherit; font-size: 15px; font-weight: 600; color: var(--fg); background: var(--chip);
  border: 1px solid var(--line); border-radius: 999px; padding: 6px 13px 6px 9px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 7px; transition: background 0.15s, border-color 0.15s, color 0.15s;
}
.chip:hover { border-color: var(--accent); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--bg1); }
.chip canvas { width: 22px; height: 22px; }
.chip .sw { width: 18px; height: 18px; border-radius: 50%; display: inline-block; box-shadow: inset 0 0 0 2px rgba(255,255,255,0.35); }
.chip:focus-visible, .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.btn {
  font: inherit; font-family: var(--f-head); font-weight: 600; font-size: 17px; cursor: pointer;
  color: var(--bg1); background: var(--accent); border: 0; border-radius: 999px; padding: 10px 22px;
}
.btn.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); font-size: 15px; padding: 9px 16px; }
.share { display: none; width: 100%; gap: 8px; align-items: center; flex-wrap: wrap; }
.share.on { display: flex; }
.share input { flex: 1 1 260px; min-width: 0; font: inherit; font-size: 14px; color: var(--fg); background: var(--chip); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.note { margin: 0; font-size: 13px; color: var(--muted); }
</style>

<div class="wrap">
  <header>
    <div>
      <p class="eyebrow">PF 2027 · přeje VYCHO</p>
      <h1>Namíchej si <span>PF 2027</span></h1>
    </div>
    <p class="note">Najeď na zvířátka myší nebo prstem.</p>
  </header>

  <div class="stage" id="stage">
    <canvas id="cv" aria-label="Zvířátka se seběhnou a poskládají do nápisu PF 2027, pod ním přeje VYCHO"></canvas>
  </div>

  <div class="desk">
    <fieldset>
      <legend>Zvířátka</legend>
      <div class="chips" id="animals"></div>
    </fieldset>
    <fieldset>
      <legend>Barvy</legend>
      <div class="chips" id="palettes"></div>
    </fieldset>
    <fieldset>
      <legend>Jak přijdou</legend>
      <div class="chips" id="moves"></div>
    </fieldset>
    <fieldset>
      <legend>Hudba</legend>
      <div class="chips" id="musics"></div>
    </fieldset>
  </div>

  <div class="actions">
    <button class="btn" id="build">Sestavit PF</button>
    <button class="btn ghost" id="mute" aria-pressed="false">Ztlumit hudbu</button>
    <button class="btn ghost" id="shareBtn">Poslat tuhle verzi</button>
    <div class="share" id="share">
      <input id="shareUrl" readonly aria-label="Odkaz na tuhle verzi">
      <span class="note" id="shareNote">Odkaz je zkopírovaný.</span>
    </div>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const TAU = Math.PI * 2;

  // ---------------- choices ----------------
  const ANIMALS = { tucnak: 'Tučňáci', liska: 'Lišky', sova: 'Sovy', kocka: 'Kočky', slepice: 'Slepice', mix: 'Všichni' };
  const PALETTES = {
    zima:   { label: 'Zimní',     bg1: '#0f1d3a', bg2: '#21407a', fg: '#eaf2ff', accent: '#9fd3ff', dark: true },
    vanoce: { label: 'Vánoční',   bg1: '#0e2a20', bg2: '#1d5039', fg: '#fff3e0', accent: '#ef5a5f', dark: true },
    zlata:  { label: 'Zlatá',     bg1: '#17130e', bg2: '#33291a', fg: '#f8edd8', accent: '#e9b949', dark: true },
    pastel: { label: 'Pastelová', bg1: '#f6eef8', bg2: '#fde6ee', fg: '#3a2d4a', accent: '#b8508a', dark: false }
  };
  const MOVES = { snih: 'Snesou se jako sníh', beh: 'Přiběhnou', spirala: 'Přiletí po spirále', skok: 'Přiskáčou' };
  const MUSICS = { koledy: 'Koleda', pop: 'Pop', rock: 'Rock', bit: '8bit' };
  const state = { animal: 'tucnak', palette: 'zima', move: 'beh', music: 'koledy' };
  (function fromHash() {
    const parts = location.hash.replace('#', '').toLowerCase().split('-');
    if (parts.length === 4 && ANIMALS[parts[0]] && PALETTES[parts[1]] && MOVES[parts[2]] && MUSICS[parts[3]])
      Object.assign(state, { animal: parts[0], palette: parts[1], move: parts[2], music: parts[3] });
  })();

  // ---------------- animal sprites (own simple drawings) ----------------
  function drawAnimal(c, kind, r) {
    const p = (fill, f) => { c.fillStyle = fill; c.beginPath(); f(); c.fill(); };
    const ell = (x, y, rx, ry) => c.ellipse(x * r, y * r, rx * r, ry * r, 0, 0, TAU);
    const poly = pts => { c.moveTo(pts[0][0] * r, pts[0][1] * r); pts.slice(1).forEach(q => c.lineTo(q[0] * r, q[1] * r)); c.closePath(); };
    if (kind === 'tucnak') {
      p('#ff9f1c', () => { ell(-0.3, 0.92, 0.25, 0.1); }); p('#ff9f1c', () => { ell(0.3, 0.92, 0.25, 0.1); });
      p('#1c2333', () => ell(0, 0.05, 0.72, 0.92));
      p('#ffffff', () => ell(0, 0.22, 0.47, 0.66));
      p('#ffffff', () => { ell(-0.22, -0.45, 0.14, 0.15); }); p('#ffffff', () => ell(0.22, -0.45, 0.14, 0.15));
      p('#1c2333', () => { ell(-0.19, -0.44, 0.07, 0.08); }); p('#1c2333', () => ell(0.19, -0.44, 0.07, 0.08));
      p('#ff9f1c', () => poly([[-0.15, -0.28], [0.15, -0.28], [0, -0.1]]));
    } else if (kind === 'liska') {
      p('#e8742a', () => poly([[-0.92, -0.95], [-0.25, -0.5], [-0.75, -0.2]])); p('#e8742a', () => poly([[0.92, -0.95], [0.25, -0.5], [0.75, -0.2]]));
      p('#5a2a10', () => poly([[-0.78, -0.72], [-0.42, -0.5], [-0.7, -0.35]])); p('#5a2a10', () => poly([[0.78, -0.72], [0.42, -0.5], [0.7, -0.35]]));
      p('#e8742a', () => poly([[-0.95, -0.35], [-0.5, -0.6], [0.5, -0.6], [0.95, -0.35], [0, 0.9]]));
      p('#fff4e6', () => poly([[-0.95, -0.35], [-0.15, 0.15], [0, 0.9]])); p('#fff4e6', () => poly([[0.95, -0.35], [0.15, 0.15], [0, 0.9]]));
      p('#1b1b1b', () => ell(0, 0.78, 0.13, 0.1));
      p('#1b1b1b', () => { ell(-0.33, -0.18, 0.08, 0.11); }); p('#1b1b1b', () => ell(0.33, -0.18, 0.08, 0.11));
    } else if (kind === 'sova') {
      p('#8a5a3b', () => poly([[-0.7, -0.6], [-0.55, -1.0], [-0.25, -0.75]])); p('#8a5a3b', () => poly([[0.7, -0.6], [0.55, -1.0], [0.25, -0.75]]));
      p('#8a5a3b', () => ell(0, 0.08, 0.78, 0.9));
      p('#c99a6b', () => ell(0, 0.42, 0.5, 0.48));
      p('#efdcbc', () => { ell(-0.32, -0.3, 0.32, 0.32); }); p('#efdcbc', () => ell(0.32, -0.3, 0.32, 0.32));
      p('#1b1b1b', () => { ell(-0.32, -0.3, 0.16, 0.16); }); p('#1b1b1b', () => ell(0.32, -0.3, 0.16, 0.16));
      p('#ffffff', () => { ell(-0.27, -0.35, 0.05, 0.05); }); p('#ffffff', () => ell(0.37, -0.35, 0.05, 0.05));
      p('#f2a33a', () => poly([[-0.1, -0.08], [0.1, -0.08], [0, 0.14]]));
    } else if (kind === 'kocka') {
      p('#6f7584', () => poly([[-0.85, -0.95], [-0.25, -0.55], [-0.8, -0.2]])); p('#6f7584', () => poly([[0.85, -0.95], [0.25, -0.55], [0.8, -0.2]]));
      p('#f2a7b8', () => poly([[-0.73, -0.72], [-0.4, -0.52], [-0.7, -0.35]])); p('#f2a7b8', () => poly([[0.73, -0.72], [0.4, -0.52], [0.7, -0.35]]));
      p('#6f7584', () => ell(0, 0.08, 0.86, 0.78));
      p('#d7e85a', () => { ell(-0.32, -0.08, 0.15, 0.17); }); p('#d7e85a', () => ell(0.32, -0.08, 0.15, 0.17));
      p('#1b1b1b', () => { ell(-0.32, -0.08, 0.05, 0.14); }); p('#1b1b1b', () => ell(0.32, -0.08, 0.05, 0.14));
      p('#f28aa0', () => poly([[-0.1, 0.2], [0.1, 0.2], [0, 0.32]]));
      c.strokeStyle = 'rgba(255,255,255,0.85)'; c.lineWidth = Math.max(0.6, r * 0.06);
      [[-1, 0.3], [-1, 0.45], [1, 0.3], [1, 0.45]].forEach(([sx, y]) => { c.beginPath(); c.moveTo(sx * 0.2 * r, y * r); c.lineTo(sx * 0.95 * r, (y - 0.05) * r); c.stroke(); });
    } else if (kind === 'slepice' || kind === 'zlata') {
      const Z = kind === 'zlata', body = Z ? '#f4c430' : '#f5efe0', wing = Z ? '#d49b12' : '#e6dcc4';
      c.strokeStyle = '#f2a33a'; c.lineWidth = Math.max(0.8, r * 0.09);
      [[-0.2], [0.15]].forEach(([x]) => { c.beginPath(); c.moveTo(x * r, 0.7 * r); c.lineTo(x * r, 0.98 * r); c.stroke(); });
      p(body, () => poly([[-0.95, -0.35], [-0.6, 0.05], [-0.9, 0.25]]));
      p(body, () => ell(-0.1, 0.25, 0.75, 0.55));
      p(body, () => ell(0.35, -0.42, 0.36, 0.36));
      p('#d8332e', () => { ell(0.22, -0.82, 0.11, 0.12); ell(0.37, -0.86, 0.12, 0.13); ell(0.52, -0.8, 0.11, 0.12); });
      p('#f2a33a', () => poly([[0.68, -0.48], [0.95, -0.4], [0.68, -0.3]]));
      p('#d8332e', () => ell(0.62, -0.18, 0.08, 0.13));
      p('#1b1b1b', () => ell(0.43, -0.5, 0.06, 0.07));
      p(wing, () => ell(-0.25, 0.25, 0.38, 0.25));
      if (Z) { c.fillStyle = 'rgba(255,255,255,0.85)'; [[-0.55, -0.7], [0.75, 0.55], [-0.85, 0.65]].forEach(([x, y]) => { c.beginPath(); c.arc(x * r, y * r, r * 0.08, 0, TAU); c.fill(); }); }
    }
  }
  const KINDS = ['tucnak', 'liska', 'sova', 'kocka', 'slepice'];
  const sprites = {};
  function makeSprites(px) {
    for (const k of KINDS.concat('zlata')) {
      const c = document.createElement('canvas'); c.width = c.height = Math.ceil(px * 2.2);
      const g = c.getContext('2d'); g.translate(c.width / 2, c.height / 2); drawAnimal(g, k, px);
      sprites[k] = c;
    }
  }

  // ---------------- UI ----------------
  function chip(group, key, html, pressed) {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.id = `${group}-${key}`;
    b.dataset.key = key; b.innerHTML = html; b.setAttribute('aria-pressed', String(pressed)); return b;
  }
  for (const [k, v] of Object.entries(ANIMALS)) {
    const b = chip('an', k, `<canvas width="44" height="44" aria-hidden="true"></canvas>${v}`, state.animal === k);
    const g = b.querySelector('canvas').getContext('2d'); g.translate(22, 23);
    if (k === 'mix') { g.scale(0.55, 0.55); [[-18, -14, 'tucnak'], [18, -14, 'liska'], [-18, 18, 'slepice'], [18, 18, 'sova']].forEach(([x, y, kk]) => { g.save(); g.translate(x, y); drawAnimal(g, kk, 16); g.restore(); }); }
    else drawAnimal(g, k, 19);
    $('animals').append(b);
  }
  for (const [k, v] of Object.entries(PALETTES)) $('palettes').append(chip('pal', k, `<span class="sw" style="background:linear-gradient(135deg, ${v.bg2}, ${v.accent})"></span>${v.label}`, state.palette === k));
  for (const [k, v] of Object.entries(MOVES)) $('moves').append(chip('mv', k, v, state.move === k));
  for (const [k, v] of Object.entries(MUSICS)) $('musics').append(chip('mu', k, v, state.music === k));
  function single(el, onPick) {
    el.addEventListener('click', e => {
      const b = e.target.closest('.chip'); if (!b) return;
      el.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', String(c === b)));
      onPick(b.dataset.key);
    });
  }
  single($('animals'), k => { state.animal = k; if (built) assemble(); });
  single($('palettes'), k => { state.palette = k; applyPalette(); });
  single($('moves'), k => { state.move = k; if (built) assemble(); });
  single($('musics'), k => { state.music = k; if (music.playing) music.start(k); });
  $('build').addEventListener('click', () => { built = true; music.ensure(); assemble(); });
  $('mute').addEventListener('click', e => {
    const b = e.currentTarget, on = b.getAttribute('aria-pressed') !== 'true';
    b.setAttribute('aria-pressed', String(on)); b.textContent = on ? 'Zapnout hudbu' : 'Ztlumit hudbu'; music.setMuted(on);
  });
  $('shareBtn').addEventListener('click', () => {
    const url = location.href.split('#')[0] + '#' + [state.animal, state.palette, state.move, state.music].join('-');
    const box = $('share'), inp = $('shareUrl'); inp.value = url; box.classList.add('on');
    try {
      navigator.clipboard.writeText(url).then(() => { $('shareNote').textContent = 'Odkaz je zkopírovaný.'; },
        () => { inp.select(); $('shareNote').textContent = 'Zkopíruj si odkaz (Ctrl+C).'; });
    } catch (err) { inp.select(); $('shareNote').textContent = 'Zkopíruj si odkaz (Ctrl+C).'; }
  });

  function applyPalette() {
    const p = PALETTES[state.palette], r = document.documentElement.style;
    r.setProperty('--bg1', p.bg1); r.setProperty('--bg2', p.bg2); r.setProperty('--fg', p.fg); r.setProperty('--accent', p.accent);
    const hex = p.fg.replace('#', ''), n = parseInt(hex, 16), rgb = `${n >> 16}, ${(n >> 8) & 255}, ${n & 255}`;
    r.setProperty('--muted', `rgba(${rgb}, 0.68)`); r.setProperty('--chip', `rgba(${rgb}, 0.08)`); r.setProperty('--line', `rgba(${rgb}, 0.2)`);
    r.setProperty('color-scheme', p.dark ? 'dark' : 'light');
    tintMask();
  }

  // ---------------- stage ----------------
  const stage = $('stage'), cv = $('cv'), ctx = cv.getContext('2d');
  let W = 0, H = 0, dpr = 1, S = 12, parts = [], t0 = 0, signAt = 0, built = false, mask = null;
  function tintMask() {
    if (!mask) return;
    const g = mask.getContext('2d'); g.globalCompositeOperation = 'source-in';
    g.fillStyle = PALETTES[state.palette].accent; g.fillRect(0, 0, mask.width, mask.height);
  }
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function resize() {
    const r = stage.getBoundingClientRect(); dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = r.width; H = r.height; cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    S = Math.max(9, Math.min(18, W / 54));
    makeSprites(S * dpr);
  }
  function targets() {
    const oc = document.createElement('canvas'); oc.width = Math.round(W); oc.height = Math.round(H);
    const g = oc.getContext('2d');
    const portrait = W < H * 0.95;
    const LINES = portrait ? ['PF', '2027'] : ['PF 2027'], GAP = 0.09;   // extra space between letters (in em)
    let fs = portrait ? H * 0.3 : H * 0.42;
    const setF = () => { g.font = `700 ${fs}px "Fredoka", "Arial Black", sans-serif`; };
    const widthOf = t => [...t].reduce((s, ch) => s + g.measureText(ch).width, 0) + GAP * fs * (t.length - 1);
    setF(); fs *= Math.min(1, ...LINES.map(t => (W * 0.88) / widthOf(t))); setF();
    g.textAlign = 'left'; g.textBaseline = 'middle'; g.fillStyle = '#000';
    const ys = portrait ? [H * 0.42 - fs * 0.55, H * 0.42 + fs * 0.55] : [H * 0.42];
    LINES.forEach((t, li) => { let lx = (W - widthOf(t)) / 2; for (const ch of t) { g.fillText(ch, lx, ys[li]); lx += g.measureText(ch).width + GAP * fs; } });
    const d = g.getImageData(0, 0, oc.width, oc.height).data, pts = [], step = S * 1.45;
    for (let y = 0; y < oc.height; y += step) for (let x = ((y / step) % 2) * step / 2; x < oc.width; x += step) {
      if (d[(Math.floor(y) * oc.width + Math.floor(x)) * 4 + 3] > 128) pts.push([x, y]);
    }
    return { pts, baseY: ys[ys.length - 1] + fs * 0.5, oc };
  }
  let signY = 0;
  function assemble() {
    const { pts, baseY, oc } = targets(); signY = baseY; mask = oc; tintMask();
    const rnd = (a, b) => a + Math.random() * (b - a);
    parts = pts.map(([tx, ty], i) => {
      const kind = state.animal === 'mix' ? KINDS[i % KINDS.length] : state.animal;
      let sx, sy;
      if (state.move === 'snih') { sx = tx + rnd(-120, 120); sy = rnd(-H, -20); }
      else if (state.move === 'beh') { sx = Math.random() < 0.5 ? rnd(-260, -30) : W + rnd(30, 260); sy = ty + rnd(-30, 30); }
      else if (state.move === 'spirala') { sx = W / 2; sy = H * 0.42; }
      else { sx = tx + rnd(-200, 200); sy = H + rnd(30, 160); }
      const delay = state.move === 'snih' ? rnd(0, 1.6) : state.move === 'spirala' ? (i / pts.length) * 1.4 : state.move === 'beh' ? rnd(0, 1.2) : (tx / W) * 1.2 + rnd(0, 0.3);
      return { kind, tx, ty, sx, sy, delay, dur: rnd(1.6, 2.4), ph: Math.random() * TAU, ox: 0, oy: 0, flip: sx > tx ? -1 : 1 };
    });
    t0 = performance.now(); signAt = reduce ? 0 : 3.4;
  }
  const ease = x => 1 - Math.pow(1 - x, 3);

  let pointer = null;
  stage.addEventListener('pointermove', e => { const r = stage.getBoundingClientRect(); pointer = { x: e.clientX - r.left, y: e.clientY - r.top }; });
  stage.addEventListener('pointerleave', () => { pointer = null; });

  // ---------------- easter eggs ----------------
  let dizzyUntil = 0, waveAt = -1, egg = null, confetti = [];
  // 1) circle the mouse fast → the animals get dizzy
  let lastPt = null, lastAng = null, turn = 0;
  stage.addEventListener('pointermove', e => {
    const pt = [e.clientX, e.clientY];
    if (lastPt) {
      const dx = pt[0] - lastPt[0], dy = pt[1] - lastPt[1];
      if (Math.hypot(dx, dy) > 5) {
        const a = Math.atan2(dy, dx);

        if (lastBar && k === 12) pluck(tri[0] - 10, t, 0.35);                               // walking bass step
        if (k % 4 === 2) noise(t, 0.05, 0.06, 'highpass', 6000);                             // shaker
        if (sec >= 1 && mel) osc('triangle', f(mel), t, 0.02, q * 2.4, 0.11);                // whistled tune
        return;
      }
      if (genre === 'pop') {
        if (k === 0) tri.forEach(m => [-6, 6].forEach(dt => osc('sawtooth', f(m), t, 0.08, q * 15, 0.03, null, dt)));
        if (k % 2 === 0) osc('square', f(tri[(k / 2) % 3] + 12), t, 0.003, q * 0.9, 0.035);   // arpeggio
        if ([0, 3, 6, 8, 11, 14].includes(k)) osc('sawtooth', f(tri[0] - 12), t, 0.005, q * 1.6, 0.14);
        if (k % 4 === 0) kick(t, 0.9);
        if (k === 4 || k === 12) clap(t, 0.4);
        if (k % 2 === 1) hat(t, 0.07);
        if (k === 0 && barInSec === 0) crash(t, 0.18);
        if (mel) { osc('square', f(mel), t, 0.01, q * 2.2, 0.06); osc('triangle', f(mel + 12), t, 0.01, q * 2.2, 0.04); }
        return;
      }
      if (genre === 'bit') {
        const arp = [tri[0], tri[1], tri[2], tri[0] + 12];
        osc('square', f(arp[k % 4] + 12), t, 0.002, q * 0.8, 0.045);
        if (k % 2 === 0) osc('triangle', f(tri[0] - 12 + (k % 4 === 2 ? 12 : 0)), t, 0.002, q * 1.5, 0.22);
        if (k % 4 === 0) noise(t, 0.04, 0.22, 'lowpass', 900);
        if (k % 8 === 4) noise(t, 0.09, 0.18, 'highpass', 2500);
        if (mel) osc('square', f(mel), t, 0.002, q * 1.8, 0.07, null, 0);
      }
    }
    function start(g) {
      if (!ac) return;
      genre = g; if (SONGS[g] && !melodies[g]) melodies[g] = compose(g);
      step = 0; nextT = ac.currentTime + 0.08;
      if (timer) clearInterval(timer);
      timer = setInterval(() => {
        const q = genre === 'koledy' ? KOL_Q : 60 / SONGS[genre].bpm / 4;
        while (nextT < ac.currentTime + 0.2) { schedStep(nextT, step); nextT += q; step++; }
      }, 25);
      api.playing = true;
    }
    function setMuted(v) { muted.v = v; if (master) master.gain.setTargetAtTime(v ? 0 : 0.7, ac.currentTime, 0.05); }
    const api = { ensure, start, setMuted, playing: false };
    return api;
  })();


  let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { resize(); if (built) assemble(); }, 160); });
  applyPalette(); resize();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { resize(); if (built) assemble(); });
  requestAnimationFrame(frame);
})();
</script>
